<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Pinyin Từ Vựng Tiếng Trung - MD2 (16 Bài)</title>
<style>
* { box-sizing: border-box; }
body {
    font-family: 'Segoe UI', Arial, 'Noto Sans', sans-serif;
    background: linear-gradient(135deg, #b91c1c, #991b1b);
    color: white;
    margin: 0;
    padding: 20px;
    min-height: 100vh;
}
.container {
    max-width: 920px;
    margin: 0 auto;
    background: rgba(255,255,255,0.12);
    padding: 28px;
    border-radius: 20px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.28);
}
h1 { text-align: center; margin: 0 0 8px; font-size: 28px; }
.subtitle { text-align: center; opacity: 0.9; margin-bottom: 24px; font-size: 15px; }
.lessons, .parts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
}
button {
    width: 100%;
    padding: 16px 12px;
    font-size: 17px;
    background: white;
    color: #333;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.25s;
    font-weight: 600;
}
button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.2);
}
.mode-btn {
    background: #4ade80;
    color: white;
    font-size: 18px;
    padding: 16px;
}
.mode-btn:hover { background: #22c55e; }
.back-btn {
    background: #f87171;
    color: white;
    margin-top: 18px;
}
.back-btn:hover { background: #ef4444; }
.progress {
    font-size: 17px;
    text-align: center;
    margin-bottom: 12px;
    opacity: 0.95;
}
.stage-info {
    text-align: center;
    font-size: 14px;
    opacity: 0.85;
    margin-bottom: 16px;
}
.hanzi {
    font-size: 84px;
    font-weight: 700;
    text-align: center;
    margin: 18px 0 8px;
    min-height: 100px;
    line-height: 1.15;
    letter-spacing: 2px;
}
.meaning {
    font-size: 22px;
    text-align: center;
    margin: 8px 0 12px;
    opacity: 0.95;
    font-style: italic;
    display: none;
    min-height: 28px;
}
.toggle-btn {
    background: #60a5fa;
    color: white;
    padding: 10px 22px;
    border-radius: 10px;
    margin: 8px auto 16px;
    display: block;
    width: auto;
    max-width: 220px;
    font-size: 15px;
}
.toggle-btn:hover { background: #3b82f6; }
.options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 18px;
}
.options button {
    font-size: 18px;
    padding: 16px 10px;
    line-height: 1.35;
    white-space: normal;
    min-height: 60px;
    font-family: inherit;
}
.result {
    font-size: 24px;
    text-align: center;
    margin: 14px 0;
    font-weight: 700;
    min-height: 32px;
}
.correct { background: #4ade80 !important; color: white !important; }
.wrong { background: #f87171 !important; color: white !important; }
.screen { display: none; }
.screen.active { display: block; }
.hint {
    text-align: center;
    font-size: 13px;
    opacity: 0.8;
    margin-top: 12px;
}
@media (max-width: 600px) {
    .hanzi { font-size: 56px; min-height: 76px; }
    .options { grid-template-columns: 1fr; }
    .options button { min-height: 54px; font-size: 16px; }
    h1 { font-size: 22px; }
}
.label-toggle-wrap {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 9999;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(8px);
    padding: 8px 12px;
    border-radius: 9999px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    font-size: 13px;
    font-weight: 600;
    user-select: none;
}
.label-toggle-wrap span { white-space: nowrap; opacity: 0.95; }
.toggle-switch {
    position: relative;
    width: 44px;
    height: 24px;
    background: rgba(255,255,255,0.3);
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.25s;
    flex-shrink: 0;
}
.toggle-switch.on { background: #4ade80; }
.toggle-switch::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    transition: transform 0.25s;
}
.toggle-switch.on::after { transform: translateX(20px); }
@media (max-width: 480px) {
    .label-toggle-wrap { top: 10px; right: 10px; padding: 6px 10px; font-size: 12px; gap: 6px; }
    .toggle-switch { width: 40px; height: 22px; }
    .toggle-switch::after { width: 16px; height: 16px; top: 3px; left: 3px; }
    .toggle-switch.on::after { transform: translateX(18px); }
}
</style>
</head>

    <div class="label-toggle-wrap" title="Bật/tắt nhãn 一、二、三、四 cho đáp án">

    <div class="container">

        <div class="subtitle">16 bài học · Hán tự → Chọn Pinyin đúng</div>

        <div id="menu-screen" class="screen active">
            <h2 style="text-align:center; margin-bottom:16px;">Chọn bài học</h2>
            <div class="lessons" id="lesson-list"></div>
        </div>

        <div id="part-screen" class="screen">

            <div class="parts" id="part-list"></div>
            <button class="back-btn" onclick="backToMenu()">← Quay lại chọn bài</button>
        </div>

        <div id="mode-screen" class="screen">

            <div style="text-align:center; margin:28px 0; display:flex; flex-wrap:wrap; gap:14px; justify-content:center;">
                <button class="mode-btn" onclick="startQuiz('normal')" style="max-width:220px;">📋 Theo thứ tự</button>
                <button class="mode-btn" onclick="startQuiz('shuffle')" style="max-width:220px;">🔀 Xáo trộn</button>
            </div>
            <button class="back-btn" onclick="backToParts()">← Quay lại chọn phần</button>
        </div>

        <div id="quiz-container" class="screen">
            <div class="progress">
                Bài <span id="lesson-num">1</span> · 
                <span id="part-label"></span> · 
                Câu <span id="current">1</span>/<span id="total">0</span>
            </div>
            <div class="stage-info" id="stage-info"></div>
            
            <div class="hanzi" id="hanzi"></div>
            <div class="meaning" id="meaning" style="display: none;"></div>
            <button class="toggle-btn" id="toggle-btn" onclick="toggleMeaning()" style="display: block;">👁️ Hiện Nghĩa</button>
            
            <div class="result" id="result"></div>
            <div class="options" id="options"></div>

            <button class="back-btn" onclick="exitQuiz()" style="width:100%; margin-top:24px;">
                ← Thoát quiz
            </button>
            <div class="hint">💡 Nhìn Hán tự → chọn Pinyin đúng · Sai → quay về đầu chặng (5 từ)</div>
        </div>
    </div>

let currentLesson = null;
let currentPart = null;
let currentMode = null;
let vocabulary = [];
let currentIndex = 0;
let isAnswered = false;
let showMeaning = false;
let showOptionLabels = false;
const stageSize = 5;

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function createLessonButtons() {
    const container = document.getElementById('lesson-list');
    container.innerHTML = '';
    Object.keys(allLessons).sort((a,b) => +a - +b).forEach(lessonNum => {
        const btn = document.createElement('button');
        btn.textContent = `Bài ${lessonNum}`;
        btn.onclick = () => selectLesson(parseInt(lessonNum));
        container.appendChild(btn);
    });
}

function selectLesson(lessonNum) {
    currentLesson = lessonNum;
    const lesson = allLessons[lessonNum];
    document.getElementById('selected-lesson-title').textContent = `Bài ${lessonNum}`;
    document.getElementById('lesson-sub').textContent = lesson.sub || '';
    
    const partList = document.getElementById('part-list');
    partList.innerHTML = '';
    
    const parts = lesson.parts;
    for (const [key, label] of Object.entries(parts)) {
        if (key === 'all' || (lesson.dataset[key] && lesson.dataset[key].length > 0)) {
            const btn = document.createElement('button');
            btn.textContent = label;
            btn.onclick = () => selectPart(key, label);
            partList.appendChild(btn);
        }
    }
    showScreen('part-screen');
}

function selectPart(partKey, partLabel) {
    currentPart = { key: partKey, label: partLabel };
    document.getElementById('mode-title').textContent = `Bài ${currentLesson} · ${partLabel}`;
    
    let count = 0;
    if (partKey === 'all') {
        const ds = allLessons[currentLesson].dataset;
        for (const k of Object.keys(ds)) {
            if (k !== 'all') count += ds[k].length;
        }
    } else {
        count = (allLessons[currentLesson].dataset[partKey] || []).length;
    }
    document.getElementById('mode-info').textContent = `Số từ: ${count}`;
    showScreen('mode-screen');
}

function backToMenu() { showScreen('menu-screen'); }
function backToParts() { showScreen('part-screen'); }

function getPartData(lessonNum, partKey) {
    const ds = allLessons[lessonNum].dataset;
    if (partKey === 'all') {
        let all = [];
        for (const k of Object.keys(ds)) {
            if (k !== 'all') all = all.concat(ds[k]);
        }
        return all;
    }
    return ds[partKey] || [];
}

function startQuiz(mode) {
    currentMode = mode;
    const raw = getPartData(currentLesson, currentPart.key);
    
    const seen = new Set();
    vocabulary = [];
    for (const item of raw) {
        if (!seen.has(item.hanzi)) {
            seen.add(item.hanzi);
            vocabulary.push({
                hanzi: item.hanzi,
                pinyin: item.pinyin,
                meaning: item.meaning
            });
        }
    }

    if (mode === 'shuffle') {
        for (let i = vocabulary.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [vocabulary[i], vocabulary[j]] = [vocabulary[j], vocabulary[i]];
        }
    }

    if (vocabulary.length === 0) {
        alert('Không có từ vựng trong phần này.');
        return;
    }

    currentIndex = 0;
    showMeaning = false;

    document.getElementById('lesson-num').textContent = currentLesson;
    document.getElementById('part-label').textContent = currentPart.label;
    document.getElementById('total').textContent = vocabulary.length;

    showScreen('quiz-container');
    loadQuestion();
}

function updateStageInfo() {
    const stage = Math.floor(currentIndex / stageSize) + 1;
    const totalStages = Math.ceil(vocabulary.length / stageSize);
    const start = Math.floor(currentIndex / stageSize) * stageSize + 1;
    const end = Math.min(start + stageSize - 1, vocabulary.length);
    document.getElementById('stage-info').textContent =
        `Chặng ${stage}/${totalStages} (từ ${start}–${end})`;
}

function toggleMeaning() {
    showMeaning = !showMeaning;
    const meaningEl = document.getElementById('meaning');
    const btn = document.getElementById('toggle-btn');
    if (showMeaning) {
        meaningEl.textContent = vocabulary[currentIndex].meaning;
        meaningEl.style.display = 'block';
        btn.textContent = '🙈 Ẩn Nghĩa';
    } else {
        meaningEl.style.display = 'none';
        btn.textContent = '👁️ Hiện Nghĩa';
    }
}

function loadQuestion() {
    isAnswered = false;
    showMeaning = false;
    const currentWord = vocabulary[currentIndex];
    
    document.getElementById('current').textContent = currentIndex + 1;
    document.getElementById('hanzi').textContent = currentWord.hanzi;
    document.getElementById('meaning').textContent = currentWord.meaning;
    document.getElementById('meaning').style.display = 'none';
    document.getElementById('toggle-btn').textContent = '👁️ Hiện Nghĩa';
    document.getElementById('result').textContent = '';
    updateStageInfo();
    
    const optionsDiv = document.getElementById('options');
    optionsDiv.innerHTML = '';

    let wrongPool = vocabulary.filter(w => 
        w.hanzi !== currentWord.hanzi && 
        w.pinyin !== currentWord.pinyin
    );
    if (wrongPool.length < 3) {
        const allInLesson = getPartData(currentLesson, 'all');
        const extra = allInLesson.filter(w => 
            w.hanzi !== currentWord.hanzi && 
            w.pinyin !== currentWord.pinyin &&
            !wrongPool.some(x => x.pinyin === w.pinyin)
        );
        wrongPool = wrongPool.concat(extra);
    }
    const seenPy = new Set();
    const uniqueWrong = [];
    for (const w of wrongPool) {
        if (!seenPy.has(w.pinyin)) {
            seenPy.add(w.pinyin);
            uniqueWrong.push(w);
        }
    }
    for (let i = uniqueWrong.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [uniqueWrong[i], uniqueWrong[j]] = [uniqueWrong[j], uniqueWrong[i]];
    }
    const wrongAnswers = uniqueWrong.slice(0, 3).map(w => w.pinyin);

    let answers = [currentWord.pinyin, ...wrongAnswers];
    for (let i = answers.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [answers[i], answers[j]] = [answers[j], answers[i]];
    }

    const optionLabels = ['一、', '二、', '三、', '四、'];
    answers.forEach((answer, idx) => {
        const btn = document.createElement('button');
        btn.dataset.meaning = answer;
        btn.textContent = showOptionLabels ? (optionLabels[idx] + answer) : answer;
        btn.onclick = () => checkAnswer(answer, currentWord.pinyin, btn);
        optionsDiv.appendChild(btn);
    });
}

function checkAnswer(selected, correct, button) {
    if (isAnswered) return;
    isAnswered = true;

    const buttons = document.querySelectorAll('#options button');
    buttons.forEach(btn => {
        const meaning = btn.dataset.meaning || btn.textContent;
        if (meaning === correct) {
            btn.classList.add('correct');
        } else if (meaning === selected && selected !== correct) {
            btn.classList.add('wrong');
        }
        btn.disabled = true;
    });

    document.getElementById('meaning').textContent = vocabulary[currentIndex].meaning;
    document.getElementById('meaning').style.display = 'block';
    document.getElementById('toggle-btn').textContent = '🙈 Ẩn Nghĩa';
    showMeaning = true;

    const resultDiv = document.getElementById('result');
    if (selected === correct) {
        resultDiv.textContent = "✓ Đúng rồi!";
        resultDiv.style.color = "#4ade80";
        
        setTimeout(() => {
            currentIndex++;
            if (currentIndex < vocabulary.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }, 300);
    } else {
        resultDiv.textContent = "✕ Sai rồi! Quay lại đầu chặng.";
        resultDiv.style.color = "#f87171";
        
        const currentStageStart = Math.floor(currentIndex / stageSize) * stageSize;
        currentIndex = currentStageStart;
        
        setTimeout(() => {
            loadQuestion();
        }, 300);
    }
}

function toggleOptionLabels() {
    showOptionLabels = !showOptionLabels;
    const toggleEl = document.getElementById('label-toggle');
    if (showOptionLabels) {
        toggleEl.classList.add('on');
    } else {
        toggleEl.classList.remove('on');
    }
    const buttons = document.querySelectorAll('#options button');
    if (buttons.length > 0) {
        const optionLabels = ['一、', '二、', '三、', '四、'];
        buttons.forEach((btn, idx) => {
            const meaning = btn.dataset.meaning;
            if (meaning) {
                btn.textContent = showOptionLabels ? (optionLabels[idx] + meaning) : meaning;
            }
        });
    }
}

function finishQuiz() {
    document.getElementById('hanzi').innerHTML = `
        <div style="font-size:52px;">🎉 Hoàn thành!</div>
        <div style="font-size:22px; margin-top:14px; font-weight:500;">
            Bạn đã luyện xong<br>Bài ${currentLesson} · ${currentPart.label}
        </div>
    `;
    document.getElementById('meaning').style.display = 'none';
    document.getElementById('toggle-btn').style.display = 'none';
    document.getElementById('stage-info').textContent = '';
    document.getElementById('result').textContent = '';
    document.getElementById('options').innerHTML = `
        <button onclick="restartCurrentQuiz()" style="width:100%; padding:20px; font-size:20px; background:#4ade80; color:white; grid-column:1/-1;">
            🔄 Chơi lại phần này
        </button>
        <button onclick="backToParts()" style="width:100%; padding:16px; font-size:17px; background:#60a5fa; color:white; grid-column:1/-1;">
            ← Chọn phần khác
        </button>
    `;
}

function restartCurrentQuiz() {
    currentIndex = 0;
    document.getElementById('toggle-btn').style.display = 'block';
    if (currentMode === 'shuffle') {
        for (let i = vocabulary.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [vocabulary[i], vocabulary[j]] = [vocabulary[j], vocabulary[i]];
        }
    }
    loadQuestion();
}

function exitQuiz() {
    document.getElementById('toggle-btn').style.display = 'block';
    showScreen('menu-screen');
}

window.onload = () => {
    createLessonButtons();
};
</script>
</body>
</html>
