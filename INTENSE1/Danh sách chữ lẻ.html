<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chữ lẻ Hán tự – Bài 1–16</title>
<style>
  :root {
    --bg: #0f1419;
    --surface: #1a2332;
    --surface2: #243044;
    --border: #2d3a4f;
    --text: #e7ecf3;
    --text-dim: #8b9bb4;
    --accent: #3b82f6;
    --accent-hover: #60a5fa;
    --green: #22c55e;
    --orange: #f59e0b;
    --pink: #ec4899;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: linear-gradient(180deg, #0f1419 80%, transparent);
    padding: 16px 16px 12px;
    backdrop-filter: blur(8px);
  }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  h1 span.badge {
    font-size: 0.7rem;
    background: var(--accent);
    color: white;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
  }
  .subtitle {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-top: 4px;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 14px;
    align-items: center;
  }
  .search-box {
    flex: 1;
    min-width: 180px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    padding: 10px 14px 10px 40px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box input:focus {
    border-color: var(--accent);
  }
  .search-box::before {
    content: "🔍";
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.9rem;
    opacity: 0.6;
  }
  .stat {
    font-size: 0.8rem;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .sort-btns {
    display: flex;
    gap: 6px;
  }
  .sort-btns button {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .sort-btns button.active, .sort-btns button:hover {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 12px 40px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  @media (min-width: 900px) {
    main {
      grid-template-columns: 1fr 380px;
      align-items: start;
    }
  }

  /* Character grid */
  .char-section {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .char-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
    gap: 6px;
    padding: 12px;
    max-height: calc(100vh - 200px);
    overflow-y: auto;
  }
  .char-btn {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--surface2);
    border: 1px solid transparent;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    font-size: 1.45rem;
    color: var(--text);
    user-select: none;
  }
  .char-btn:hover {
    background: #2a3a55;
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .char-btn.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(59,130,246,0.4);
  }
  .char-btn .freq {
    position: absolute;
    top: 3px;
    right: 4px;
    font-size: 0.55rem;
    background: rgba(0,0,0,0.35);
    color: #a5b4c8;
    padding: 1px 4px;
    border-radius: 6px;
    line-height: 1.2;
  }
  .char-btn.active .freq {
    background: rgba(255,255,255,0.25);
    color: white;
  }
  .char-btn.hidden { display: none; }

  /* Detail panel */
  .detail-panel {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    position: sticky;
    top: 140px;
    max-height: calc(100vh - 160px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .detail-header {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }
  .detail-header .big-char {
    font-size: 3.2rem;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 6px;
  }
  .detail-header .meta {
    color: var(--text-dim);
    font-size: 0.85rem;
  }
  .detail-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }
  .word-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
    transition: border-color 0.15s;
  }
  .word-card:hover {
    border-color: var(--accent);
  }
  .word-card .han {
    font-size: 1.35rem;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .word-card .pinyin {
    color: var(--accent-hover);
    font-size: 0.9rem;
    margin-bottom: 2px;
  }
  .word-card .han-am {
    color: var(--orange);
    font-size: 0.82rem;
    margin-bottom: 4px;
  }
  .word-card .nghia {
    color: var(--text);
    font-size: 0.92rem;
  }
  .word-card .lesson {
    display: inline-block;
    margin-top: 6px;
    font-size: 0.7rem;
    background: var(--surface2);
    color: var(--text-dim);
    padding: 2px 8px;
    border-radius: 6px;
  }
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
  }
  .empty-state .icon {
    font-size: 2.5rem;
    margin-bottom: 12px;
    opacity: 0.5;
  }

  /* Mobile detail as bottom sheet */
  @media (max-width: 899px) {
    .detail-panel {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      top: auto;
      max-height: 55vh;
      border-radius: 16px 16px 0 0;
      z-index: 200;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      box-shadow: 0 -8px 40px rgba(0,0,0,0.5);
    }
    .detail-panel.open {
      transform: translateY(0);
    }
    .detail-panel .close-btn {
      display: block;
      position: absolute;
      top: 12px;
      right: 14px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--surface2);
      color: var(--text);
      font-size: 1.1rem;
      cursor: pointer;
    }
    .char-grid {
      max-height: none;
    }
  }
  @media (min-width: 900px) {
    .detail-panel .close-btn { display: none; }
  }

  /* Highlight matching chars inside words */
  .hl {
    color: var(--pink);
    font-weight: 700;
  }

  footer {
    text-align: center;
    padding: 20px;
    color: var(--text-dim);
    font-size: 0.75rem;
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <h1>字 Chữ lẻ Hán tự <span class="badge" id="charCount">0</span></h1>
    <div class="subtitle">Bấm vào chữ → xem tất cả từ chứa chữ đó · Bài 1–16</div>
    <div class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Tìm chữ / Pinyin / Nghĩa tiếng Việt..." autocomplete="off">
      </div>
      <div class="sort-btns">
        <button class="active" data-sort="freq">Nhiều từ nhất</button>
        <button data-sort="unicode">A→Z</button>
      </div>
      <div class="stat" id="statText"></div>
    </div>
  </div>
</header>

<main>
  <section class="char-section">
    <div class="char-grid" id="charGrid"></div>
  </section>

  <aside class="detail-panel" id="detailPanel">
    <button class="close-btn" id="closeBtn">×</button>
    <div class="detail-header" id="detailHeader">
      <div class="empty-state">
        <div class="icon">👆</div>
        <div>Chọn một chữ lẻ bên trái<br>để xem các từ chứa chữ đó</div>
      </div>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </aside>
</main>

<footer>
  Tổng hợp từ vựng Bài 1–16 · Dùng offline · Click chữ = từ chứa chữ
</footer>

const words = DATA.words;
const allChars = DATA.chars.slice(); // already sorted by freq
const charMap = DATA.charMap;

let currentSort = 'freq';
let activeChar = null;
let filteredChars = allChars.slice();

const charGrid = document.getElementById('charGrid');
const detailPanel = document.getElementById('detailPanel');
const detailHeader = document.getElementById('detailHeader');
const detailBody = document.getElementById('detailBody');
const searchInput = document.getElementById('searchInput');
const charCountEl = document.getElementById('charCount');
const statText = document.getElementById('statText');
const closeBtn = document.getElementById('closeBtn');

charCountEl.textContent = allChars.length;

function renderGrid() {
  const frag = document.createDocumentFragment();
  filteredChars.forEach(ch => {
    const btn = document.createElement('button');
    btn.className = 'char-btn' + (ch === activeChar ? ' active' : '');
    btn.dataset.char = ch;
    const freq = charMap[ch] ? charMap[ch].length : 0;
    btn.innerHTML = `<span class="freq">${freq}</span>${ch}`;
    btn.title = `${ch} · ${freq} từ`;
    btn.addEventListener('click', () => selectChar(ch));
    frag.appendChild(btn);
  });
  charGrid.innerHTML = '';
  charGrid.appendChild(frag);
  statText.textContent = `Hiển thị ${filteredChars.length} / ${allChars.length} chữ`;
}

function selectChar(ch) {
  activeChar = ch;
  // update active class
  document.querySelectorAll('.char-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.char === ch);
  });

  const idxs = charMap[ch] || [];
  const related = idxs.map(i => words[i]);

  detailHeader.innerHTML = `
    <div class="big-char">${ch}</div>
    <div class="meta">${related.length} từ chứa chữ «${ch}»</div>
  `;

  if (related.length === 0) {
    detailBody.innerHTML = '<div class="empty-state">Không có từ nào</div>';
  } else {
    detailBody.innerHTML = related.map(w => {
      // highlight the char inside the word
      let hanHtml = '';
      for (const c of w.han) {
        if (c === ch) hanHtml += `<span class="hl">${c}</span>`;
        else hanHtml += c;
      }
      return `
        <div class="word-card">
          <div class="han">${hanHtml}</div>
          <div class="pinyin">${w.pinyin || ''}</div>
          <div class="han-am">${w.han_am || ''}</div>
          <div class="nghia">${w.nghia || ''}</div>
          <span class="lesson">Bài ${w.lesson} · ${w.tu_loai || ''}</span>
        </div>
      `;
    }).join('');
  }

  // mobile open
  detailPanel.classList.add('open');
}

function closeDetail() {
  detailPanel.classList.remove('open');
  activeChar = null;
  document.querySelectorAll('.char-btn.active').forEach(b => b.classList.remove('active'));
}

closeBtn.addEventListener('click', closeDetail);

// Search
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) {
    filteredChars = getSorted(allChars);
    renderGrid();
    return;
  }

  // Match char itself, or any word that contains the char and matches pinyin/nghia/han
  const matched = new Set();

  // Direct char match
  allChars.forEach(ch => {
    if (ch.includes(q) || ch.toLowerCase().includes(q)) matched.add(ch);
  });

  // Search in words
  words.forEach((w, idx) => {
    const hay = (w.han + ' ' + (w.pinyin||'') + ' ' + (w.han_am||'') + ' ' + (w.nghia||'')).toLowerCase();
    if (hay.includes(q)) {
      // add all chars of this word
      for (const c of w.han) {
        if (charMap[c]) matched.add(c);
      }
    }
  });

  filteredChars = getSorted([...matched]);
  renderGrid();
});

function getSorted(arr) {
  if (currentSort === 'freq') {
    return arr.slice().sort((a, b) => {
      const fa = (charMap[a]||[]).length;
      const fb = (charMap[b]||[]).length;
      return fb - fa || a.localeCompare(b, 'zh');
    });
  }
  return arr.slice().sort((a, b) => a.localeCompare(b, 'zh'));
}

document.querySelectorAll('.sort-btns button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sort-btns button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentSort = btn.dataset.sort;
    filteredChars = getSorted(filteredChars);
    renderGrid();
  });
});

// Init
filteredChars = getSorted(allChars);
renderGrid();

// Keyboard: Escape closes
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDetail();
});
</script>
